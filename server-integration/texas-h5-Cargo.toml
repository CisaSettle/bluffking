[workspace]
members = ["engine", "mental-poker", "server", "gto-solver", "tools/bnb-hd-recovery"]
exclude = ["draw-games/verifier"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["BluffKing Contributors"]

[workspace.dependencies]
# Shared across workspace members
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Rust review standard (L0/L1): in-repo Clippy policy so a bare `cargo clippy`
# is strict in local verification. Crates opt in with
# `[lints] workspace = true`.
# NOTE: do NOT add `pedantic`/`nursery`/`restriction` here: local
# `clippy -- -D warnings` would promote those noisy, allow-by-default groups to
# hard errors. Keep the maintained policy at `all` only.
[workspace.lints.clippy]
all = "deny"

[profile.dev]
opt-level = 0
# Full debug symbols made each server build hundreds of MB. Opt in locally
# with CARGO_PROFILE_DEV_DEBUG when needed.
debug = 0

# Argon2id at the production parameters takes ~200 ms per hash unoptimized vs
# ~11 ms optimized, so debug-server register/login crossed the 100 ms latency
# alert. Optimize only the hashing crates; dev then matches release cost.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
# Overflow checks in release (U10, dual-AI OSS review): chip arithmetic
# (pot/contribution/award) is unchecked u32; a silent wrap would corrupt chip
# accounting past detection. The hot solver path is f64 Monte-Carlo, so the
# integer-bounds-check cost is negligible. Turns an unreachable-but-catastrophic
# wrap into a loud panic instead.
overflow-checks = true
# Owner 2026-11-01: prioritize runtime optimization over build time and memory.
# Fat LTO optimizes across the dependency graph; one codegen unit gives LLVM
# the largest per-crate optimization scope. Build on a sufficiently provisioned
# host instead of silently lowering optimization for the old small Docker VM.
# Actual speedups remain workload-dependent; these flags are not a benchmark.
lto = "fat"
codegen-units = 1
incremental = false
# Preserve task-level panic isolation; abort would change runtime recovery.
panic = "unwind"
